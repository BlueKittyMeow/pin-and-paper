name: pin_and_paper
description: ADHD-friendly task management with beautiful aesthetic
publish_to: 'none'
# Version format: MAJOR.MINOR.PATCH+BUILD
# 3.9.0 = Phase 3.9 complete (Onboarding Quiz & User Preferences)
# +BUILD = Build number (increment with each build).
# JUMPED 7 -> 2008 on 2026-08-06: an earlier `flutter build apk
# --split-per-abi` shipped an arm64-v8a split whose versionCode Flutter
# offsets to 2*1000+7 = 2007. A plain universal build (code 7) then reads
# as a DOWNGRADE on any phone that installed that split and won't install.
# Base bumped above 2007 so universal builds upgrade cleanly. RULE: ship
# universal `app-release.apk` only (never --split-per-abi to a test phone),
# and keep BUILD climbing.
version: 3.9.0+2008

environment:
  sdk: '>=3.5.0 <4.0.0'  # Supports Flutter 3.24+ (Dart 3.5+) through current stable

dependencies:
  flutter:
    sdk: flutter

  # Data persistence
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0  # For desktop platform support
  path_provider: ^2.1.0

  # State management
  provider: ^6.1.0

  # Utilities
  uuid: ^4.0.0
  intl: ^0.19.0
  path: ^1.9.1
  clock: ^1.1.0  # Phase 3: Testable timestamps
  package_info_plus: ^8.1.0  # App version info

  # Phase 3: Tree view for hierarchical tasks
  flutter_fancy_tree_view2: ^1.6.2  # Phase 3.2: Drag-and-drop tree view

  # Phase 2: AI Integration
  http: ^1.2.0  # HTTP requests to Claude API
  flutter_secure_storage: ^9.0.0  # Secure API key storage (Android Keystore)
  connectivity_plus: ^6.0.0  # Internet connectivity checking (List API)

  # Phase 2 Stretch Goals
  shared_preferences: ^2.2.0  # UI preferences (hide completed toggle)
  string_similarity: ^2.0.0  # Fuzzy matching for natural language task completion

  # Phase 3.7: Natural Language Date Parsing
  flutter_js: ^0.8.5  # JavaScript runtime for chrono.js integration

  # Phase 3.8: Due Date Notifications
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1  # ^0.11.0 requires Dart 3.10+; our SDK is 3.9.2
  flutter_timezone: ^5.0.1

  # Phase 4.0: Supabase Sync
  supabase_flutter: ^2.8.0  # Supabase client + auth + realtime
  url_launcher: ^6.2.0     # OAuth browser launch + copy/paste fallback

  # Phase 4.4-MVP: Spatial View (Milestone 4) — path deps, app is nested one
  # level inside this repo (pin-and-paper/pin_and_paper/), so both modules'
  # sibling checkouts are two levels up.
  pin_and_paper_canvas:
    path: ../../pin_and_paper_canvas
  pin_and_paper_card_renderer:
    path: ../../pin_and_paper_card_renderer
  # Card drawings M-D5: direct dep on the drawing engine (editor + previews).
  pin_and_paper_sketchpad:
    path: ../../pin_and_paper_sketchpad

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.0

flutter:
  uses-material-design: true

  # Phase 3.7: Natural Language Date Parsing assets
  # Phase 3.9: Onboarding Quiz & Badge System assets
  assets:
    - assets/js/chrono.min.js
    - assets/images/quiz/
    - assets/images/badges/1x/
    - assets/images/onboarding/
    - assets/images/spatial/SeamlessKraft1.jpg
    - assets/images/spatial/desk_void_backdrop.jpg
    - assets/images/spatial/desk_modeled.webp
    - assets/images/spatial/mat_greenfelt.webp
    - assets/images/spatial/shadow_floor.webp
